# Auto-deploy: every push to "main" uploads the website to Hostinger (public_html) by FTP.
# Needs 3 repository secrets: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
# (GitHub repo -> Settings -> Secrets and variables -> Actions).
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ${{ secrets.FTP_SERVER }}
    steps:
      - name: Check FTP details are added
        if: env.FTP_SERVER == ''
        run: echo "FTP secrets are not added yet - skipping deploy. Add FTP_SERVER, FTP_USERNAME and FTP_PASSWORD in repo Settings > Secrets and variables > Actions."

      - name: Get website files
        if: env.FTP_SERVER != ''
        uses: actions/checkout@v4

      - name: Clean FTP server address (removes ftp:// and trailing /)
        id: ftp
        if: env.FTP_SERVER != ''
        run: |
          host="${FTP_SERVER#ftp://}"; host="${host#ftps://}"; host="${host%%/*}"; host="$(echo "$host" | tr -d '[:space:]')"
          echo "host=$host" >> "$GITHUB_OUTPUT"

      - name: Find the right upload folder (public_html)
        id: dir
        if: env.FTP_SERVER != ''
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          # Main Hostinger FTP account opens one level above public_html; extra FTP accounts open inside it.
          if curl -s --list-only --user "$FTP_USERNAME:$FTP_PASSWORD" "ftp://${{ steps.ftp.outputs.host }}/" | grep -qx 'public_html'; then
            echo "dir=public_html/" >> "$GITHUB_OUTPUT"; echo "Uploading into public_html/"
          else
            echo "dir=./" >> "$GITHUB_OUTPUT"; echo "FTP account already opens inside public_html - uploading to ./"
          fi

      - name: Upload to Hostinger (public_html)
        if: env.FTP_SERVER != ''
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ steps.ftp.outputs.host }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./
          server-dir: ${{ steps.dir.outputs.dir }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
